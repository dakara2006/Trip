<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BeTravel - 나의 여행 일정</title>
<style>
  :root{
    --paper:#F2F2F7;
    --paper-dim:#E5E5EA;
    --ink:#1C1C1E;
    --ink-soft:#8E8E93;
    --line:#E5E5EA;
    --card:#FFFFFF;
    --red:#FF3B30;
    --blue:#007AFF;
    --subway:#007AFF;
    --bus:#34C759;
    --walk:#8E8E93;
    --car:#FF9500;
    --fill:#7676801F;
    --fill-strong:#76768033;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --day0:#007AFF; --day1:#34C759; --day2:#FF9500; --day3:#AF52DE; --day4:#FF2D55; --day5:#5AC8FA;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;}
  body{display:flex;flex-direction:column;min-height:100vh;}
  input,select,button,textarea{font-family:inherit;font-size:15px;}
  button{cursor:pointer;}
  button:active{transform:scale(.97);opacity:.7;}

  /* ===== Header (iOS large-title nav bar) ===== */
  .board{
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:10;
  }
  .board-badge{
    background:var(--blue);
    color:#fff;
    font-weight:700;
    font-size:11px;
    letter-spacing:.03em;
    padding:5px 10px;
    border-radius:8px;
    flex-shrink:0;
  }
  .trip-title-input{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(46%,320px);
    text-align:center;
    background:transparent;
    border:none;
    color:var(--ink);
    font-weight:700;
    font-size:17px;
    letter-spacing:-.01em;
    padding:6px 4px;
    outline:none;
    border-radius:8px;
    z-index:1;
  }
  .trip-title-input:focus{background:var(--fill);}
  .trip-title-input[readonly]{background:transparent;}
  .board-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;position:relative;z-index:2;}
  .btn{
    border:none;
    background:var(--fill);
    color:var(--blue);
    padding:9px 14px;
    border-radius:20px;
    font-weight:600;
    font-size:13.5px;
    transition:.15s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--fill-strong);}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.primary:hover{background:#0068D6;}
  .view-tag{
    font-size:11px;
    font-weight:600;
    background:var(--fill);
    color:var(--ink-soft);
    padding:6px 10px;
    border-radius:20px;
  }

  /* ===== Layout ===== */
  .layout{display:flex;flex:1;min-height:0;position:relative;}
  .sidebar{
    width:400px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--line);
    background:var(--paper);
    min-height:0;
  }
  .map-wrap{flex:1;position:relative;min-height:0;background:var(--paper-dim);}
  .map-hint{
    position:absolute;
    top:14px;left:50%;
    transform:translateX(-50%);
    background:rgba(28,28,30,.85);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    color:#fff;
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:20px;
    z-index:500;
    box-shadow:0 6px 16px rgba(0,0,0,.18);
    white-space:nowrap;
    pointer-events:none;
  }
  #map{position:absolute;inset:0;}

  /* ===== Mobile Handle (Bottom Sheet) ===== */
  .sidebar-handle-wrap{display:none;}

  .day-tabs{
    display:flex;
    gap:2px;
    margin:12px 14px 0;
    padding:2px;
    background:var(--fill);
    border-radius:10px;
  }
  .day-tab{
    flex:1;
    text-align:center;
    font-size:12.5px;
    font-weight:600;
    padding:7px 10px;
    border-radius:8px;
    background:transparent;
    color:var(--ink);
    white-space:nowrap;
    transition:.15s;
  }
  .day-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15);}

  .panel-scroll{flex:1;overflow-y:auto;padding:14px;}

  /* ===== Form ===== */
  .add-form{
    background:var(--card);
    border:none;
    border-radius:var(--radius-lg);
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.04);
  }
  .add-form h3{
    margin:0 0 12px;
    font-size:12.5px;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:700;
    border-bottom:none;
    padding-bottom:0;
  }
  .field{margin-bottom:12px;position:relative;}
  .field label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  .field input,.field select{
    width:100%;
    padding:11px 13px;
    border:none;
    border-radius:var(--radius-sm);
    background:var(--fill);
    color:var(--ink);
    transition:.15s;
  }
  .field input:focus,.field select:focus{outline:none;background:var(--fill-strong);box-shadow:0 0 0 3px rgba(0,122,255,.15);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .chip{
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:20px;
    border:none;
    background:var(--fill);
    color:var(--ink);
    cursor:pointer;
    transition:.15s;
  }
  .chip:hover{background:var(--fill-strong);}
  .search-results{
    position:absolute;
    z-index:20;
    top:100%;left:0;right:0;
    background:#fff;
    border:none;
    border-radius:var(--radius-md);
    margin-top:6px;
    max-height:240px;
    overflow-y:auto;
    box-shadow:0 8px 30px rgba(0,0,0,.14);
  }
  .search-results div{
    padding:10px 13px;
    font-size:13px;
    border-bottom:1px solid var(--line);
    color:var(--ink);
  }
  .search-results div:last-child{border-bottom:none;}
  .search-results div:hover{background:var(--fill);cursor:pointer;}
  .search-results .empty{color:var(--ink-soft);cursor:default;}
  .selected-place{
    font-size:12.5px;
    color:var(--blue);
    font-weight:600;
    background:rgba(0,122,255,.1);
    border-radius:var(--radius-sm);
    padding:8px 12px;
    margin-top:6px;
  }
  .add-btn{
    width:100%;
    background:var(--blue);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:var(--radius-md);
    font-weight:700;
    font-size:15.5px;
    margin-top:10px;
    transition:.15s;
  }
  .add-btn:hover{background:#0068D6;}
  .add-btn:disabled{background:var(--fill);color:var(--ink-soft);cursor:not-allowed;}

  /* ===== Transport option chips ===== */
  .transport-options{display:flex;flex-wrap:wrap;gap:8px;}
  .transport-chip{
    border:none;
    background:var(--fill);
    border-radius:20px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
    transition:.15s;
  }
  .transport-chip:hover{background:var(--fill-strong);}
  .transport-chip.active{background:var(--blue);color:#fff;}
  .transport-chip .chip-time{font-weight:700;}
  .transport-chip.estimated .chip-time::after{content:' *';}
  .transport-empty{font-size:12.5px;color:var(--ink-soft);padding:8px 2px;}
  .transport-note-hint{font-size:11px;color:var(--ink-soft);margin-top:8px;width:100%;}
  .arrival-preview{
    font-weight:700;
    font-size:15px;
    background:rgba(0,122,255,.1);
    color:var(--blue);
    border-radius:var(--radius-sm);
    padding:12px;
    text-align:center;
  }

  /* ===== Timeline ===== */
  .day-group{margin-bottom:20px;}
  .day-heading{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin-bottom:10px;
    padding-left:4px;
  }
  .day-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .stop-list{list-style:none;margin:0;padding:0;}
  
  .stop-item{position:relative;padding-left:36px;padding-bottom:6px; cursor:grab;}
  .stop-item:active{cursor:grabbing;}

  /* 🔥 드래그 시 고스트 요소가 솔리드 블록처럼 보이게 처리 */
  .stop-item-drag {
    opacity: 1 !important; 
    z-index: 9999 !important;
    cursor: grabbing !important;
  }
  .stop-item-drag .stop-card {
    box-shadow: 0 16px 32px rgba(0,0,0,0.15) !important;
    transform: scale(1.02); 
    transition: transform 0.1s;
  }
  .stop-item-ghost {
    opacity: 0.15; 
    background: var(--paper-dim);
    border-radius: var(--radius-md);
  }

  .stop-node{
    position:absolute;left:0;top:8px;
    width:26px;height:26px;
    border-radius:50%;
    color:#fff;
    font-weight:700;
    font-size:11.5px;
    display:flex;align-items:center;justify-content:center;
    border:2.5px solid var(--paper);
    z-index:2;
  }
  .stop-connector{
    position:absolute;left:12.25px;top:34px;bottom:-6px;
    width:1.5px;
    border-radius:2px;
    opacity:.55;
    pointer-events:none;
  }
  .stop-connector.mode-subway{background:var(--subway);}
  .stop-connector.mode-bus{background:var(--bus);}
  .stop-connector.mode-walk{background:repeating-linear-gradient(to bottom,var(--walk) 0 4px,transparent 4px 8px);}
  .stop-connector.mode-car{background:repeating-linear-gradient(to bottom,var(--car) 0 6px,transparent 6px 10px);}
  
  .stop-card{
    background:var(--card);
    border:none;
    border-radius:var(--radius-md);
    padding:12px 14px;
    margin-bottom:6px;
    box-shadow:0 4px 20px rgba(0,0,0,.04);
  }

  .stop-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .stop-name{font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
  .stop-addr{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stop-note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;padding-top:6px;border-top:1px solid var(--line);line-height:1.4;}
  .stop-time{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
    text-align:right;
  }
  .stop-remove{
    background:var(--fill);border:none;color:var(--ink-soft);
    width:22px;height:22px;border-radius:50%;
    font-size:14px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .stop-remove:hover{background:rgba(255,59,48,.12);color:var(--red);}
  .stop-edit{
    background:var(--fill);border:none;color:var(--blue);
    width:22px;height:22px;border-radius:50%;
    font-size:12px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .stop-edit:hover{background:rgba(0,122,255,.14);}
  .transit-note{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;
    padding:8px 4px 12px 4px;
    color:var(--ink-soft);
  }
  .transit-info {display:flex;align-items:center;gap:6px;}
  .mode-badge{
    font-size:10px;
    font-weight:700;
    padding:2.5px 8px;
    border-radius:20px;
    color:#fff;
  }
  .mode-badge.mode-subway{background:var(--subway);}
  .mode-badge.mode-bus{background:var(--bus);}
  .mode-badge.mode-walk{background:var(--walk);}
  .mode-badge.mode-car{background:var(--car);}

  .map-link-btn{
    font-size:12px;
    color:var(--blue);
    text-decoration:none;
    font-weight:600;
  }
  .map-link-btn:hover{text-decoration:underline;}

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:34px 16px;
    background:var(--card);
    border:none;
    border-radius:var(--radius-lg);
    line-height:1.6;
  }

  /* ===== Map legend ===== */
  .legend{
    position:absolute;
    right:12px;bottom:12px;
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    border:none;
    border-radius:var(--radius-md);
    padding:11px 13px;
    font-size:12px;
    font-weight:500;
    z-index:400;
    box-shadow:0 6px 20px rgba(0,0,0,.1);
  }
  .legend-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
  .legend-row:last-child{margin-bottom:0;}
  .legend-swatch{width:16px;height:3px;border-radius:3px;}
  .legend-swatch.mode-walk{background:repeating-linear-gradient(to right,var(--walk) 0 4px,transparent 4px 8px);}
  .legend-swatch.mode-car{background:repeating-linear-gradient(to right,var(--car) 0 6px,transparent 6px 10px);}

  /* 🔥 지도 마커 디자인 변경 (테두리 제거, 숫자 얇게) */
  .trip-marker{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-weight:500; 
    font-size:14.5px;
    line-height:1;
    box-shadow:0 4px 14px rgba(0,0,0,.28);
  }
  .trip-marker.current{
    width:42px;height:42px;
    font-size:18px;
    z-index:999;
    animation:markerPulse 1.6s ease-in-out infinite;
  }
  @keyframes markerPulse{
    0%{ box-shadow:0 4px 12px rgba(0,0,0,.25), 0 0 0 0 rgba(0,122,255,.45); }
    70%{ box-shadow:0 4px 12px rgba(0,0,0,.25), 0 0 0 14px rgba(0,122,255,0); }
    100%{ box-shadow:0 4px 12px rgba(0,0,0,.25), 0 0 0 0 rgba(0,122,255,0); }
  }

  /* ===== Storyboard panel ===== */
  .storyboard-panel{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.04);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .storyboard-transit{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    font-size:12px;font-weight:500;color:var(--ink-soft);
    background:var(--fill);
    border-radius:20px;
    padding:6px 12px;
    width:fit-content;
  }
  .storyboard-step-index{
    font-size:12.5px;font-weight:700;color:var(--blue);
    letter-spacing:.01em;
  }
  .storyboard-name{font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .storyboard-addr{font-size:13px;color:var(--ink-soft);margin-top:-4px;}
  .storyboard-note{
    font-size:13px;color:var(--ink);
    background:var(--fill);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    line-height:1.5;
  }
  .storyboard-meta{display:flex;gap:22px;margin-top:2px;}
  .storyboard-meta-item{display:flex;flex-direction:column;gap:3px;}
  .storyboard-meta-label{font-size:11px;color:var(--ink-soft);font-weight:500;}
  .storyboard-meta-value{font-size:16px;font-weight:700;color:var(--ink);}
  .storyboard-dots{display:flex;justify-content:center;align-items:center;gap:5px;margin:2px 0;}
  .storyboard-dot{width:6px;height:6px;border-radius:50%;background:var(--fill-strong);transition:.2s;}
  .storyboard-dot.active{background:var(--blue);width:18px;border-radius:3px;}
  .storyboard-nav{display:flex;gap:10px;}
  .storyboard-nav .nav-btn{
    flex:1;
    background:var(--fill);color:var(--ink);border:none;
    padding:13px;border-radius:var(--radius-md);font-weight:700;font-size:14.5px;
  }
  .storyboard-nav .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .storyboard-nav .nav-btn.primary{background:var(--blue);color:#fff;}
  .storyboard-clone-btn{
    width:100%;background:var(--fill);color:var(--blue);border:none;
    padding:12px;border-radius:var(--radius-md);font-weight:700;font-size:13.5px;
  }

  /* ===== Day Transition Overlay ===== */
  .day-transition-overlay{
    position:fixed;inset:0;background:rgba(28,28,30,.85);
    z-index:9999;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 0.6s cubic-bezier(0.22,1,0.36,1);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .day-transition-overlay.show{opacity:1;pointer-events:auto;}
  .day-transition-text{
    font-size:42px;font-weight:800;color:#fff;letter-spacing:0.05em;
    transform:translateY(20px) scale(0.95);transition:all 0.6s cubic-bezier(0.22,1,0.36,1);
    text-shadow:0 4px 20px rgba(0,0,0,.5);
  }
  .day-transition-overlay.show .day-transition-text{transform:translateY(0) scale(1);}

  /* ===== Recent Trips ===== */
  .recent{margin-top:24px;}
  .recent h4{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;font-weight:700;}
  .recent-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;border:none;border-radius:var(--radius-md);
    background:var(--card);margin-bottom:10px;font-size:14.5px;font-weight:700;
    box-shadow:0 4px 20px rgba(0,0,0,.04);
  }
  .recent-item button{
    border:none;background:var(--fill);padding:8px 14px;
    border-radius:20px;font-size:13px;font-weight:700;color:var(--blue);transition:.15s;
  }
  .recent-item button:hover{background:var(--fill-strong);}
  .recent-code{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-left:8px;}

  /* ===== Modal ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;
  }
  .modal{
    background:rgba(255,255,255,.98);
    border-radius:var(--radius-lg);max-width:400px;width:100%;
    padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .modal p{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.5;}
  .code-display{
    font-weight:700;letter-spacing:.14em;
    font-size:24px;
    background:var(--fill);border-radius:var(--radius-md);
    padding:14px;text-align:center;margin-bottom:12px;color:var(--ink);
  }
  .modal-field{margin-bottom:10px;}
  .modal-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .modal-field input{width:100%;padding:11px 13px;border:none;border-radius:var(--radius-sm);background:var(--fill);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;}
  .btn-secondary{
    background:var(--fill);border:none;color:var(--ink);
    padding:12px;border-radius:var(--radius-md);font-weight:600;
  }
  .btn-secondary.picking{background:var(--red);color:#fff;}
  .btn-dark{background:var(--blue);color:#fff;border:none;padding:12px;border-radius:var(--radius-md);font-weight:700;}
  .modal-status{font-size:12.5px;margin-top:10px;color:var(--ink-soft);min-height:16px;text-align:center;}
  .modal-close{
    position:absolute;top:16px;right:16px;background:var(--fill);border:none;
    width:28px;height:28px;border-radius:50%;font-size:16px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .modal-wrap{position:relative;}

  /* 🔥 모바일 반응형 및 바텀 시트(Bottom Sheet) 기능 (지도 100% 반영) */
  @media (max-width:860px){
    .board { justify-content: center; height: 58px; padding: 0; }
    .board-badge, .board-actions, .view-tag { display: none !important; }
    .trip-title-input { position: static; transform: none; width: 100%; font-size: 18px; text-align: center; }

    .layout{display:block; position:relative; height:calc(100vh - 58px); overflow:hidden;}
    /* 🔥 지도가 모바일에서 화면 전체 높이(100%)를 덮도록 수정 */
    .map-wrap{position:absolute; inset:0; height:100%; z-index:1; width:100%;}

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2228a3c639c856b1a16a015bc0cbf91e&libraries=services"></script>

<!-- 파이어베이스 라이브러리 -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- 솔리드 블록 드래그 앤 드롭을 위한 SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>
(function(){
  "use strict";

  // =========================================================================
  // 🔥 파이어베이스 설정 및 초기화
  // =========================================================================
  var firebaseConfig = {
    apiKey: "본인의_API_KEY", // <--- 실제 발급받은 키로 교체하세요!
    authDomain: "trip-df7f2.firebaseapp.com",
    databaseURL: "https://trip-df7f2-default-rtdb.firebaseio.com",
    projectId: "trip-df7f2",
    storageBucket: "trip-df7f2.firebasestorage.app",
    messagingSenderId: "498795878026",
    appId: "1:498795878026:web:d027a1862d9b1a9550bf73",
    measurementId: "G-S827RE69HH"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  var db = firebase.database();

  // =========================================================================
  // ODsay 대중교통 길찾기 API 키
  // =========================================================================
  var ODSAY_API_KEY = "1Bvx7yJi5paJSexfKQLWPA";

  var MODE_LABEL = {subway:'지하철', bus:'버스', walk:'도보', car:'자동차'};
  var MODE_COLOR = {subway:'#2B6CB8', bus:'#2E8B57', walk:'#8E8E93', car:'#FF9500'};
  var MODE_ICON  = {subway:'🚇', bus:'🚌', walk:'🚶', car:'🚗'};
  var DAY_COLORS = ['#007AFF','#34C759','#FF9500','#AF52DE','#FF2D55','#5AC8FA'];

  var WALK_KMH = 4.5;
  var CAR_KMH = 22;

  var state = {
    title: '나의 여행',
    stops: [],
    activeDay: 'all',
    viewMode: false,
    currentStep: 0,
    lastStoryboardDay: -1,
    selectedPlace: null,
    selectedTransport: null,
    pendingPick: false,
    tempMarker: null
  };

  var map, ps, markers = [], polylines = [];
  var transitionTimer = null; 

  // ---------- utils ----------
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(d){
    if(!d) return '날짜 미정';
    var parts = d.split('-');
    return parts[1]+'월 '+parts[2]+'일';
  }
  function durLabel(min){
    if(min==null || isNaN(min) || min <= 0) return '';
    var h = Math.floor(min/60), m = min%60;
    if(h && m) return h+'시간 '+m+'분 머무름';
    if(h) return h+'시간 머무름';
    return m+'분 머무름';
  }
  function addMinutes(hhmm, mins){
    if(!hhmm) return '';
    var p = hhmm.split(':');
    var total = parseInt(p[0],10)*60 + parseInt(p[1],10) + (mins||0);
    total = ((total % 1440) + 1440) % 1440;
    var h = Math.floor(total/60), m = total % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  function haversineKm(lat1,lng1,lat2,lng2){
    var R = 6371;
    var dLat = (lat2-lat1) * Math.PI/180;
    var dLng = (lng2-lng1) * Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
            Math.sin(dLng/2)*Math.sin(dLng/2);
    var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }
  function estimateWalkMinutes(km){ return Math.max(1, Math.round(km / WALK_KMH * 60)); }
  function estimateCarMinutes(km){ return Math.max(1, Math.round(km / CAR_KMH * 60)); }

  function sortStateStops(){
    var arr = state.stops.map(function(s, i){ return {s: s, i: i}; });
    arr.sort(function(a, b){
      if(a.s.date < b.s.date) return -1;
      if(a.s.date > b.s.date) return 1;
      return a.i - b.i; 
    });
    state.stops = arr.map(function(x){ return x.s; });
    return state.stops;
  }
  
  function getStopsOnDate(date){
    sortStateStops();
    return state.stops.filter(function(s){ return s.date === date; });
  }

  function groupByDay(list){
    var mapObj={}, order=[];
    list.forEach(function(s){
      var key = s.date||'__nodate__';
      if(!mapObj[key]){mapObj[key]=[]; order.push(key);}
      mapObj[key].push(s);
    });
    order.sort(function(a,b){ return a<b?-1:a>b?1:0; });
    return order.map(function(k){ return {key:k, stops:mapObj[k]}; });
  }
  function dayColor(idx){ return DAY_COLORS[idx % DAY_COLORS.length]; }

  // ---------- 카카오 맵 초기화 ----------
  function initMap(){
    var mapContainer = document.getElementById('map');
    var mapOption = {
        center: new kakao.maps.LatLng(37.566826, 126.978656),
        level: 5
    };

    map = new kakao.maps.Map(mapContainer, mapOption);
    if(typeof kakao !== 'undefined' && kakao.maps.services) {
      ps = new kakao.maps.services.Places();
    }

    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
      if(!state.pendingPick) return;
      var latlng = mouseEvent.latLng;
      var lat = latlng.getLat();
      var lng = latlng.getLng();

      state.selectedPlace = {
        name: document.getElementById('placeSearch').value.trim() || '지도 지정 장소',
        address: '위도 '+lat.toFixed(5)+', 경도 '+lng.toFixed(5),
        lat: lat, lng: lng
      };
      hideResults();
      var sp = document.getElementById('selectedPlace');
      sp.style.display='block';
      sp.textContent = '선택됨 (지도 클릭): '+state.selectedPlace.address;
      togglePicking(false);

      var selectedDate = document.getElementById('stopDate').value;
      var stopsOnDate = getStopsOnDate(selectedDate);
      var isFirstOfDay = stopsOnDate.length === 0;

      if(!isFirstOfDay) {
        loadTransportOptions(lat, lng);
      } else {
        resetTransportSelection();
      }

      updateAddBtn();
      showPreviewMarker(lat, lng);
    });
  }

  function togglePicking(on){
    state.pendingPick = on;
    var btn = document.getElementById('pickLocationBtn');
    var hint = document.getElementById('mapHint');
    if(on){
      btn.textContent = '지도를 클릭해 위치를 선택하세요';
      btn.classList.add('picking');
      if(hint) hint.style.display = 'block';
    } else {
      btn.textContent = '목록에 없으면 지도를 클릭해 위치 지정';
      btn.classList.remove('picking');
      if(hint) hint.style.display = 'none';
    }
  }

  function showPreviewMarker(lat, lng){
    if(state.tempMarker) {
      state.tempMarker.setMap(null);
    }
    var coords = new kakao.maps.LatLng(lat, lng);
    state.tempMarker = new kakao.maps.Marker({ position: coords });
    state.tempMarker.setMap(map);
    map.panTo(coords);
  }

  // ---------- 카카오 맵 렌더링 ----------
  function renderMap(){
    markers.forEach(function(m){ m.setMap(null); });
    markers = [];
    polylines.forEach(function(p){ p.setMap(null); });
    polylines = [];

    var groups = groupByDay(sortStateStops());
    if(state.activeDay!=='all'){
      groups = groups.filter(function(g){ return g.key===state.activeDay; });
    }

    var TRANSPORT_LINE_STYLE = {
      subway: { color: MODE_COLOR.subway, strokeStyle: 'solid',    strokeWeight: 5 },
      bus:    { color: MODE_COLOR.bus,    strokeStyle: 'solid',    strokeWeight: 5 },
      walk:   { color: MODE_COLOR.walk,   strokeStyle: 'shortdot', strokeWeight: 4 },
      car:    { color: MODE_COLOR.car,    strokeStyle: 'shortdash', strokeWeight: 4 }
    };

    var highlightId = null;
    if(state.viewMode){
      var storySteps = sortStateStops();
      if(storySteps[state.currentStep]) highlightId = storySteps[state.currentStep].id;
    }

    var bounds = new kakao.maps.LatLngBounds();
    var hasStops = false;

    groups.forEach(function(g, gi){
      var globalIdx = indexOfDayKey(g.key);
      var color = state.activeDay==='all' ? dayColor(globalIdx) : dayColor(globalIdx);
      var coordsList = [];

      g.stops.forEach(function(s, i){
        hasStops = true;
        var coords = new kakao.maps.LatLng(s.lat, s.lng);
        bounds.extend(coords);
        coordsList.push(coords);

        var isCurrent = highlightId && s.id === highlightId;
        if(state.viewMode && !isCurrent) return; 

        var markerClass = 'trip-marker' + (isCurrent ? ' current' : '');
        var content = '<div class="'+markerClass+'" style="background:'+color+'">'+(i+1)+'</div>';

        var customOverlay = new kakao.maps.CustomOverlay({
            position: coords,
            content: content,
            xAnchor: 0.5,
            yAnchor: 0.5,
            zIndex: isCurrent ? 999 : 3
        });
        customOverlay.setMap(map);
        markers.push(customOverlay);
      });

      for(var i = 0; i < coordsList.length - 1; i++){
        var next = g.stops[i+1];
        var mode = next.transport || 'walk';
        var lineStyle = TRANSPORT_LINE_STYLE[mode] || TRANSPORT_LINE_STYLE.walk;

        var polyline = new kakao.maps.Polyline({
            path: [coordsList[i], coordsList[i+1]],
            strokeWeight: lineStyle.strokeWeight,
            strokeColor: lineStyle.color,
            strokeOpacity: 0.85,
            strokeStyle: lineStyle.strokeStyle
        });
        polyline.setMap(map);
        polylines.push(polyline);
      }
    });

    if(hasStops && !state.viewMode){
      map.setBounds(bounds);
    }
    renderLegend(groups);
  }

  function indexOfDayKey(key){
    var order = groupByDay(sortStateStops()).map(function(g){return g.key;});
    return order.indexOf(key);
  }

  function renderLegend(groups){
    var el = document.getElementById('legend');
    var rows = ['subway','bus','walk','car'].map(function(m){
      return '<div class="legend-row"><span class="legend-swatch mode-'+m+'" style="background:'+MODE_COLOR[m]+'"></span>'+MODE_LABEL[m]+'</div>';
    }).join('');
    var dayRows = '';
    if(groups.length>1){
      dayRows = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);">' +
        groups.map(function(g,i){
          var idx = state.activeDay==='all'? i : indexOfDayKey(g.key);
          return '<div class="legend-row"><span class="day-dot" style="background:'+dayColor(idx)+'"></span>'+fmtDate(g.key==='__nodate__'?null:g.key)+'</div>';
        }).join('') + '</div>';
    }
    el.innerHTML = rows + dayRows;
    el.style.display = (state.stops.length && !state.viewMode) ? 'block' : 'none';
  }

  // ---------- timeline ----------
  function renderDayTabs(){
    var groups = groupByDay(sortStateStops());
    var el = document.getElementById('dayTabs');
    if(groups.length<2){ el.innerHTML=''; return; }
    var html = '<span class="day-tab'+(state.activeDay==='all'?' active':'')+'" data-day="all">전체</span>';
    groups.forEach(function(g, idx){
      html += '<span class="day-tab'+(state.activeDay===g.key?' active':'')+'" data-day="'+g.key+'">'+(idx+1)+'일차</span>';
    });
    el.innerHTML = html;
    
    Array.prototype.forEach.call(el.querySelectorAll('.day-tab'), function(t){
      t.addEventListener('click', function(){ 
        state.activeDay = t.getAttribute('data-day'); 
        if(state.activeDay !== 'all') {
            document.getElementById('stopDate').value = state.activeDay;
            var evt = new Event('change');
            document.getElementById('stopDate').dispatchEvent(evt);
        }
        renderAll(); 
      });
    });
  }

  function renderTimeline(){
    var el = document.getElementById('timeline');
    var groups = groupByDay(sortStateStops());
    if(state.activeDay!=='all') groups = groups.filter(function(g){return g.key===state.activeDay;});

    if(!state.stops.length){
      el.innerHTML = '<div class="empty-state">아직 추가된 장소가 없어요.<br>위에서 장소를 검색해 일정을 만들어보세요.</div>';
      return;
    }

    var html = '';
    groups.forEach(function(g, gi){
      var globalIdx = indexOfDayKey(g.key);
      var color = state.activeDay==='all' ? dayColor(globalIdx) : dayColor(globalIdx);
      html += '<div class="day-group">';
      html += '<div class="day-heading"><span class="day-dot" style="background:'+color+'"></span>'+(globalIdx+1)+'일차 ('+fmtDate(g.key==='__nodate__'?null:g.key)+')</div>';
      html += '<ul class="stop-list">';
      
      g.stops.forEach(function(s, i){
        var isLast = i===g.stops.length-1;
        html += '<li class="stop-item" data-id="'+s.id+'">';
        html += '<div class="stop-node" style="background:'+color+'">'+(i+1)+'</div>';

        if(!isLast){
          var nextNode = g.stops[i+1];
          var mode = nextNode.transport || 'walk';
          html += '<div class="stop-connector mode-'+mode+'"></div>';
        }

        html += '<div class="stop-card">';
        html += '<div class="stop-top"><div><div class="stop-name">'+escapeHtml(s.name)+'</div><div class="stop-addr">'+escapeHtml(s.address||'')+'</div></div>';
        html += '<div style="display:flex;align-items:flex-start;gap:4px;">';
        html += '<div class="stop-time">'+(s.time||'--:--')+(s.duration?('<br>'+durLabel(s.duration)):'')+'</div>';
        if(!state.viewMode) html += '<button class="stop-edit" data-edit="'+s.id+'" title="수정">✎</button>';
        if(!state.viewMode) html += '<button class="stop-remove" data-remove="'+s.id+'" title="삭제">×</button>';
        html += '</div></div>';
        if(s.note) html += '<div class="stop-note">📝 '+escapeHtml(s.note)+'</div>';
        html += '</div>';

        if(!isLast){
          var next = g.stops[i+1];
          var mode2 = next.transport || 'walk';
          var kakaoMapRouteUrl = 'https://map.kakao.com/link/to/' + encodeURIComponent(next.name) + ',' + next.lat + ',' + next.lng;

          html += '<div class="transit-note">';
          html += '<div class="transit-info"><span class="mode-badge mode-'+mode2+'">'+MODE_LABEL[mode2]+'</span>';
          if(next.transportMin != null) html += '<span>약 '+next.transportMin+'분 이동</span>';
          html += '</div>';
          html += '<a href="'+kakaoMapRouteUrl+'" target="_blank" class="map-link-btn">길찾기 ↗</a>';
          html += '</div>';
        }
        html += '</li>';
      });
      html += '</ul></div>';
    });
    el.innerHTML = html;

    if(!state.viewMode){
      // 기존 삭제, 수정 버튼 이벤트 바인딩
      Array.prototype.forEach.call(el.querySelectorAll('[data-remove]'), function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-remove');
          state.stops = state.stops.filter(function(s){ return s.id!==id; });
          renderAll();
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll('[data-edit]'), function(btn){
        btn.addEventListener('click', function(){
          openEditStopModal(btn.getAttribute('data-edit'));
        });
      });

      // 🔥 SortableJS 솔리드 드래그 구현부
      if (typeof Sortable !== 'undefined') {
        var lists = el.querySelectorAll('.stop-list');
        Array.prototype.forEach.call(lists, function(listEl) {
          Sortable.create(listEl, {
            group: 'shared', 
            animation: 250,  
            ghostClass: 'stop-item-ghost', // 고스트는 살짝 투명
            dragClass: 'stop-item-drag', // 움직이는 원본은 투명도 1(불투명)로 유지
            forceFallback: true, // HTML5 고스트 이미지 사용 안함(필수)
            fallbackClass: 'stop-item-drag',
            fallbackOnBody: true,
            delay: 150, 
            delayOnTouchOnly: true,
            onEnd: function(evt) {
              var itemEl = evt.item;
              var srcId = itemEl.getAttribute('data-id');
              
              var prevEl = itemEl.previousElementSibling;
              var nextEl = itemEl.nextElementSibling;
              var newDate, targetIdx;
              
              if(prevEl) {
                var prevId = prevEl.getAttribute('data-id');
                var prevIdx = state.stops.findIndex(function(s){ return s.id === prevId; });
                newDate = state.stops[prevIdx].date;
                targetIdx = prevIdx + 1;
              } else if(nextEl) {
                var nextId = nextEl.getAttribute('data-id');
                var nextIdx = state.stops.findIndex(function(s){ return s.id === nextId; });
                newDate = state.stops[nextIdx].date;
                targetIdx = nextIdx;
              } else {
                return;
              }

              var srcIdx = state.stops.findIndex(function(s){ return s.id === srcId; });
              if(srcIdx < 0) return;

              var movedItem = state.stops.splice(srcIdx, 1)[0];
              var oldDate = movedItem.date;
              movedItem.date = newDate;

              if (srcIdx < targetIdx) targetIdx--; 
              
              state.stops.splice(targetIdx, 0, movedItem);
              sortStateStops();
              
              var grps = groupByDay(state.stops);
              grps.forEach(function(g){
                if(g.stops.length > 0) {
                  g.stops[0].transport = null;
                  g.stops[0].transportMin = null;
                }
              });

              if (oldDate !== newDate) recomputeTimesForDate(oldDate);
              recomputeTimesForDate(newDate);
              
              renderAll();
              
              // 시간 재설정 모달 자동으로 띄우기
              setTimeout(function(){
                var stopsOnDate = getStopsOnDate(newDate);
                var movedLocalIdx = stopsOnDate.findIndex(function(s){ return s.id === movedItem.id; });
                if (movedLocalIdx === 0 && stopsOnDate.length > 1) {
                  openEditStopModal(stopsOnDate[1].id);
                } else {
                  openEditStopModal(movedItem.id);
                }
              }, 300);
            }
          });
        });
      }
    }
  }

      var deltaY = e.touches[0].clientY - startY;
      var isCollapsed = sidebar.classList.contains('collapsed');
      
      var maxCollapse = sidebar.offsetHeight - 40; 
      var baseTranslate = isCollapsed ? maxCollapse : 0;
      var newTranslate = baseTranslate + deltaY;
      
      if(newTranslate < 0) newTranslate = 0; 
      if(newTranslate > maxCollapse) newTranslate = maxCollapse;

      sidebar.style.transform = 'translateY(' + newTranslate + 'px)';
  }, {passive: true});

  handle.addEventListener('touchend', function(e){
      if(!isDraggingSheet || window.innerWidth > 860) return;
      isDraggingSheet = false;
      sidebar.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
      
      var transformStr = sidebar.style.transform;
      var match = transformStr.match(/translateY\((.*)px\)/);
      if(match) {
          var currentTranslate = parseFloat(match[1]);
          var maxCollapse = sidebar.offsetHeight - 40;
          if(currentTranslate > maxCollapse / 3) { 
              sidebar.classList.add('collapsed');
          } else {
              sidebar.classList.remove('collapsed');
          }

  function renderStoryboard(animate, checkTransition){
    if(animate === undefined) animate = true;
    var steps = getStoryboardSteps();
    if(!steps.length) return;
    if(state.currentStep < 0) state.currentStep = 0;
    if(state.currentStep > steps.length - 1) state.currentStep = steps.length - 1;

    var idx = state.currentStep;
    var current = steps[idx];

    var uniqueDates = [];
    steps.forEach(function(s){ if(uniqueDates.indexOf(s.date) === -1) uniqueDates.push(s.date); });
    var currentDayNum = uniqueDates.indexOf(current.date) + 1;

    if(checkTransition && state.lastStoryboardDay !== currentDayNum) {
      state.lastStoryboardDay = currentDayNum;
      playDayTransition(currentDayNum);
    }

    var html = '';

    if(idx > 0 && current.transport){
      var mode = current.transport || 'walk';
      html += '<div class="storyboard-transit">';
      html += '<span class="mode-badge mode-'+mode+'">'+MODE_LABEL[mode]+'</span>';
      if(current.transportMin != null) html += '<span>'+current.transportMin+'분 이동</span>';
      html += '</div>';
    }

    html += '<div class="storyboard-step-index">'+currentDayNum+'일차 · '+(idx+1)+'번째 장소</div>';
    html += '<div><div class="storyboard-name">'+escapeHtml(current.name)+'</div>';
    html += '<div class="storyboard-addr">'+escapeHtml(current.address||'')+'</div></div>';

    if(current.note){
      html += '<div class="storyboard-note">📝 '+escapeHtml(current.note)+'</div>';
    }

    html += '<div class="storyboard-meta">';
    html += '<div class="storyboard-meta-item"><span class="storyboard-meta-label">도착 시간</span><span class="storyboard-meta-value">'+(current.time||'--:--')+'</span></div>';
    html += '<div class="storyboard-meta-item"><span class="storyboard-meta-label">머무는 시간</span><span class="storyboard-meta-value">'+(durLabel(current.duration)||'-')+'</span></div>';
    html += '</div>';

    html += '<div class="storyboard-dots">';
    steps.forEach(function(_, i){
      html += '<span class="storyboard-dot'+(i===idx?' active':'')+'"></span>';
    });
    html += '</div>';

    html += '<div class="storyboard-nav">';
    html += '<button type="button" class="nav-btn" id="storyPrevBtn"'+(idx===0?' disabled':'')+'>이전</button>';
    html += '<button type="button" class="nav-btn primary" id="storyNextBtn"'+(idx===steps.length-1?' disabled':'')+'>다음</button>';
    html += '</div>';

    html += '<button type="button" class="storyboard-clone-btn" id="cloneEditBtn">이 일정 편집하기</button>';

    var panel = document.getElementById('storyboard');
    panel.innerHTML = html;

    document.getElementById('storyPrevBtn').addEventListener('click', function(){ goToStep(state.currentStep - 1); });
    document.getElementById('storyNextBtn').addEventListener('click', function(){ goToStep(state.currentStep + 1); });
    document.getElementById('cloneEditBtn').addEventListener('click', cloneToEdit);

    if(map && current){
      var coords = new kakao.maps.LatLng(current.lat, current.lng);
      if(animate){
        animateMapTravel(coords, 600, function(){
          map.setLevel(4, { animate: true });
        });
      } else {
        map.setCenter(coords);
        map.setLevel(4);
      }
    }
    renderMap();
  }

  function animateMapTravel(toCoords, duration, onDone){
    if(!map){ if(onDone) onDone(); return; }
    var start = map.getCenter();
    var lat1 = start.getLat(), lng1 = start.getLng();
    var lat2 = toCoords.getLat(), lng2 = toCoords.getLng();
    var steps = 24;
    var stepTime = duration / steps;
    var i = 0;
    function tick(){
      i++;
      var t = i / steps;
      var eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
      var lat = lat1 + (lat2 - lat1) * eased;
      var lng = lng1 + (lng2 - lng1) * eased;
      map.setCenter(new kakao.maps.LatLng(lat, lng));
      if(i < steps){
        setTimeout(tick, stepTime);
      } else if(onDone){
        onDone();
      }
    }
    tick();
  }

  function loadTransportOptions(toLat, toLng){
    resetTransportSelection();
    updateAddBtn();

    var selectedDate = document.getElementById('stopDate').value;
    var stopsOnDate = getStopsOnDate(selectedDate);
    if(stopsOnDate.length === 0) return;

    var last = stopsOnDate[stopsOnDate.length - 1]; 
    var km = haversineKm(last.lat, last.lng, toLat, toLng);
    var walkMin = estimateWalkMinutes(km);
    var carMin = estimateCarMinutes(km);
    var transitTimes = {subway:null, bus:null};

    var container = document.getElementById('transportOptions');
    container.innerHTML = '<div class="transport-empty">대중교통 시간을 불러오는 중...</div>';

    function renderChips(){
      var opts = [];
      if(transitTimes.subway!=null) opts.push({mode:'subway', minutes:transitTimes.subway, estimated:false});
      if(transitTimes.bus!=null) opts.push({mode:'bus', minutes:transitTimes.bus, estimated:false});
      opts.push({mode:'car', minutes:carMin, estimated:true});
      opts.push({mode:'walk', minutes:walkMin, estimated:true});

      container.innerHTML = opts.map(function(o){
        return '<button type="button" class="transport-chip'+(o.estimated?' estimated':'')+'" data-mode="'+o.mode+'" data-min="'+o.minutes+'">'+
          '<span>'+MODE_ICON[o.mode]+'</span><span>'+MODE_LABEL[o.mode]+'</span><span class="chip-time">'+o.minutes+'분</span>'+
          '</button>';
      }).join('') + '<div class="transport-note-hint">* 자동차·도보는 직선거리 기반 추정 시간이에요.</div>';

      Array.prototype.forEach.call(container.querySelectorAll('.transport-chip'), function(btn){
        btn.addEventListener('click', function(){
          Array.prototype.forEach.call(container.querySelectorAll('.transport-chip'), function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          var mode = btn.getAttribute('data-mode');
          var minutes = parseInt(btn.getAttribute('data-min'),10);
          selectTransportOption(mode, minutes);
        });
      });
    }

    renderChips();

    if(!ODSAY_API_KEY || ODSAY_API_KEY.indexOf("여기에") !== -1){
      return;
    }

    var url = "https://api.odsay.com/v1/api/searchPubTransPathT?SX="+last.lng+"&SY="+last.lat+"&EX="+toLng+"&EY="+toLat+"&apiKey="+encodeURIComponent(ODSAY_API_KEY);

    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.result && data.result.path){
          data.result.path.forEach(function(p){
            var t = p.info && p.info.totalTime;
            if(t==null) return;
            if(p.pathType===1){ transitTimes.subway = transitTimes.subway==null ? t : Math.min(transitTimes.subway, t); }
            if(p.pathType===2){ transitTimes.bus = transitTimes.bus==null ? t : Math.min(transitTimes.bus, t); }
            if(p.pathType===3){
              transitTimes.subway = transitTimes.subway==null ? t : Math.min(transitTimes.subway, t);
              transitTimes.bus = transitTimes.bus==null ? t : Math.min(transitTimes.bus, t);
            }
          });
        }
        renderChips();
      })
      .catch(function(err){
        console.error("ODsay API Error:", err);
        renderChips();
      });
  }

  function recomputeTimesForDate(date){
    sortStateStops();
    var stopsOnDate = getStopsOnDate(date);
    for(var i = 1; i < stopsOnDate.length; i++){
      var prev = stopsOnDate[i-1];
      var s = stopsOnDate[i];
      if(s.transportMin != null){
        var departure = addMinutes(prev.time, prev.duration);
        s.time = addMinutes(departure, s.transportMin);
      }
    }
  }

  var tempEditTransport = null;
  function openEditStopModal(stopId){
    var idx = state.stops.findIndex(function(s){ return s.id === stopId; });
    if(idx === -1) return;
    var stop = state.stops[idx];
    
    var stopsOnDate = getStopsOnDate(stop.date);
    var dateIdx = stopsOnDate.findIndex(function(s){ return s.id === stopId; });
    var prev = dateIdx > 0 ? stopsOnDate[dateIdx-1] : null;

    tempEditTransport = { mode: stop.transport, minutes: stop.transportMin };

    var root = document.getElementById('modalRoot');
    var html = 
      '<div class="modal-overlay" id="ovEdit"><div class="modal modal-wrap" style="max-width:440px;">' +
      '<button class="modal-close" id="closeEdit">×</button>' +
      '<h3>'+escapeHtml(stop.name)+'</h3>' +
      '<p>머무는 시간과 메모를 바꿀 수 있습니다. 순서를 변경했다면 이동 수단도 다시 확인해주세요.</p>';

    if(prev) {
      html += '<div class="field"><label>이전 장소('+escapeHtml(prev.name)+')로부터 이동 수단 재설정</label>';
      html += '<div class="transport-options" id="editTransportOptions">대중교통 시간을 불러오는 중...</div></div>';
    }

    html += '<div class="modal-field"><label>머무는 시간 (분)</label><input type="number" id="editDuration" min="0" step="5" value="'+stop.duration+'"></div>' +
      '<div class="chips" id="editDurationChips" style="margin:-4px 0 14px;">' +
        '<span class="chip" data-min="30">30분</span>' +
        '<span class="chip" data-min="60">1시간</span>' +
        '<span class="chip" data-min="90">1시간30분</span>' +
        '<span class="chip" data-min="120">2시간</span>' +
      '</div>' +
      '<div class="modal-field"><label>메모</label><input type="text" id="editNote" value="'+escapeHtml(stop.note||'')+'" placeholder="이 장소에 대한 메모를 남겨보세요"></div>' +
      '<div class="modal-actions"><button class="btn-secondary" id="cancelEdit">취소</button><button class="btn-dark" id="saveEdit">저장</button></div>' +
      '</div></div>';

    root.innerHTML = html;

    if(prev) {
      loadEditTransportOptions(prev.lat, prev.lng, stop.lat, stop.lng, stop.transport);
    }

    document.getElementById('closeEdit').addEventListener('click', closeModal);
    document.getElementById('cancelEdit').addEventListener('click', closeModal);
    document.getElementById('ovEdit').addEventListener('click', function(e){ if(e.target.id==='ovEdit') closeModal(); });
    document.getElementById('editDurationChips').addEventListener('click', function(e){
      if(e.target.classList.contains('chip')){
        document.getElementById('editDuration').value = e.target.getAttribute('data-min');
      }
    });
    
    document.getElementById('saveEdit').addEventListener('click', function(){
      stop.duration = parseInt(document.getElementById('editDuration').value, 10) || 0;
      stop.note = document.getElementById('editNote').value.trim();
      
      if(prev && tempEditTransport && tempEditTransport.mode) {
        stop.transport = tempEditTransport.mode;
        stop.transportMin = tempEditTransport.minutes;
      }

      recomputeTimesForDate(stop.date);
      closeModal();
      renderAll();
    });
  }

  function loadEditTransportOptions(fromLat, fromLng, toLat, toLng, currentMode){
    var km = haversineKm(fromLat, fromLng, toLat, toLng);
    var walkMin = estimateWalkMinutes(km);
    var carMin = estimateCarMinutes(km);
    var transitTimes = {subway:null, bus:null};

    var container = document.getElementById('editTransportOptions');
    if(!container) return;

    function renderEditChips(){
      var opts = [];
      if(transitTimes.subway!=null) opts.push({mode:'subway', minutes:transitTimes.subway, estimated:false});
      if(transitTimes.bus!=null) opts.push({mode:'bus', minutes:transitTimes.bus, estimated:false});
      opts.push({mode:'car', minutes:carMin, estimated:true});
      opts.push({mode:'walk', minutes:walkMin, estimated:true});

      container.innerHTML = opts.map(function(o){
        var isActive = tempEditTransport && tempEditTransport.mode === o.mode ? ' active' : '';
        return '<button type="button" class="transport-chip'+(o.estimated?' estimated':'')+isActive+'" data-mode="'+o.mode+'" data-min="'+o.minutes+'">'+
          '<span>'+MODE_ICON[o.mode]+'</span><span>'+MODE_LABEL[o.mode]+'</span><span class="chip-time">'+o.minutes+'분</span>'+
          '</button>';
      }).join('');

      Array.prototype.forEach.call(container.querySelectorAll('.transport-chip'), function(btn){
        btn.addEventListener('click', function(){
          Array.prototype.forEach.call(container.querySelectorAll('.transport-chip'), function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          tempEditTransport = {
            mode: btn.getAttribute('data-mode'),
            minutes: parseInt(btn.getAttribute('data-min'),10)
          };
        });
      });
    }

    renderEditChips();

    if(!ODSAY_API_KEY || ODSAY_API_KEY.indexOf("여기에") !== -1) return;

    var url = "https://api.odsay.com/v1/api/searchPubTransPathT?SX="+fromLng+"&SY="+fromLat+"&EX="+toLng+"&EY="+toLat+"&apiKey="+encodeURIComponent(ODSAY_API_KEY);
    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data && data.result && data.result.path){
          data.result.path.forEach(function(p){
            var t = p.info && p.info.totalTime;
            if(t==null) return;
            if(p.pathType===1){ transitTimes.subway = transitTimes.subway==null ? t : Math.min(transitTimes.subway, t); }
            if(p.pathType===2){ transitTimes.bus = transitTimes.bus==null ? t : Math.min(transitTimes.bus, t); }
            if(p.pathType===3){
              transitTimes.subway = transitTimes.subway==null ? t : Math.min(transitTimes.subway, t);
              transitTimes.bus = transitTimes.bus==null ? t : Math.min(transitTimes.bus, t);
            }
          });
        }
        renderEditChips();
      })
      .catch(function(err){ console.error("ODsay Edit Error:", err); });
  }

  function openShareModal(){
    if(!state.stops.length){
      alert('공유하기 전에 장소를 하나 이상 추가해주세요.');
      return;
    }
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-overlay" id="ov1"><div class="modal modal-wrap">' +
      '<button class="modal-close" id="close1">×</button>' +
      '<h3>일정 공유하기</h3>' +
      '<p>6자리 코드를 통해 다른 사람도 이 일정을 똑같이 볼 수 있습니다.</p>' +
      '<div id="shareBody"><button class="btn-dark" id="genCodeBtn" style="width:100%;">공유 코드 및 링크 생성</button></div>' +
      '<div class="modal-status" id="shareStatus"></div>' +
      '</div></div>';
    document.getElementById('close1').addEventListener('click', closeModal);
    document.getElementById('ov1').addEventListener('click', function(e){ if(e.target.id==='ov1') closeModal(); });
    document.getElementById('genCodeBtn').addEventListener('click', function(){
      var status = document.getElementById('shareStatus');
      status.textContent = '저장 중...';
      var code = genCode();
      saveTrip(code).then(function(res){
        if(!res){ status.textContent='저장에 실패했어요.'; return; }
        rememberMyTrip(code, state.title);
        var link = location.origin + location.pathname + '?code=' + code;
        var body = document.getElementById('shareBody');
        body.innerHTML =
          '<div class="code-display">'+code+'</div>' +
          '<div class="modal-field"><label>공유 링크</label><input type="text" id="linkOut" readonly value="'+link+'"></div>' +
          '<div class="modal-actions"><button class="btn-secondary" id="copyCode">코드 복사</button><button class="btn-dark" id="copyLink">링크 복사</button></div>';
        document.getElementById('copyCode').addEventListener('click', function(){ copyText(code, this); });
        document.getElementById('copyLink').addEventListener('click', function(){ copyText(link, this); });
        status.textContent='';
        loadRecentTrips();
      });
    });
  }

  function copyText(text, btn){
    var original = btn.textContent;
    function done(ok){ btn.textContent = ok? '복사됨!' : '직접 복사해주세요'; setTimeout(function(){btn.textContent=original;},1500); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){done(true);}).catch(function(){done(false);});
    } else { done(false); }
  }

  function openLoadModal(prefill){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-overlay" id="ov2"><div class="modal modal-wrap">' +
      '<button class="modal-close" id="close2">×</button>' +
      '<h3>코드로 불러오기</h3>' +
      '<p>전달받은 6자리 공유 코드를 입력하세요.</p>' +
      '<div class="modal-field"><label>공유 코드</label><input type="text" id="codeIn" maxlength="6" style="text-transform:uppercase;letter-spacing:.14em;font-weight:700;" value="'+(prefill||'')+'"></div>' +
      '<div class="modal-actions"><button class="btn-secondary" id="cancelLoad">취소</button><button class="btn-dark" id="doLoad">불러오기</button></div>' +
      '<div class="modal-status" id="loadStatus"></div>' +
      '</div></div>';
    document.getElementById('close2').addEventListener('click', closeModal);
    document.getElementById('cancelLoad').addEventListener('click', closeModal);
    document.getElementById('ov2').addEventListener('click', function(e){ if(e.target.id==='ov2') closeModal(); });
    document.getElementById('doLoad').addEventListener('click', function(){
      var code = document.getElementById('codeIn').value.trim().toUpperCase();
      if(!code) return;
      var status = document.getElementById('loadStatus');
      status.textContent = '불러오는 중...';
      loadTrip(code).then(function(res){
        if(!res){ status.textContent='일정을 찾을 수 없습니다.'; return; }
        applyLoadedTrip(res.value, code);
        closeModal();
      });
    });
    if(prefill) setTimeout(function(){ document.getElementById('doLoad').click(); }, 50);
  }

  function applyLoadedTrip(raw, code){
    try{
      var data = JSON.parse(raw);
      state.title = data.title || '공유된 여행';
      state.stops = data.stops || [];
      state.viewMode = true;
      state.currentStep = 0;
      state.activeDay = 'all';
      state.lastStoryboardDay = -1; 
      
      document.getElementById('viewTag').style.display='inline-block';
      document.getElementById('viewTag').textContent = '보기 모드 · '+code;
      document.getElementById('tripTitle').readOnly = true;
      document.getElementById('addForm').style.display='none';
      renderAll();
    }catch(e){
      alert('일정 데이터를 읽는 중 문제가 발생했어요.');
    }
  }

  document.getElementById('shareOpenBtn').addEventListener('click', openShareModal);
  document.getElementById('loadOpenBtn').addEventListener('click', function(){ openLoadModal(); });

  // 초기 실행
  initMap();
  loadRecentTrips();
  renderAll();

  var urlCode = new URLSearchParams(location.search).get('code');
  if(urlCode){
    loadTrip(urlCode.toUpperCase()).then(function(res){
      if(res){ applyLoadedTrip(res.value, urlCode.toUpperCase()); }
    });
  }

})();
</script>
